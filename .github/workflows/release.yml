name: Release

on:
  push:
    branches:
      - find_n6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Package release assets
      run: |
        cd toolkit_linux && zip -r ../toolkit_linux.zip . && cd ..
        cd toolkit_windows && zip -r ../toolkit_windows.zip . && cd ..
        cd toolkit_android && zip -r ../toolkit_android.zip . && cd ..
        cd magisk_module && zip -r ../magisk_module.zip . && cd ..
        cd vbmetafixer_linux && zip -r ../vbmetafixer_linux.zip . && cd ..
        cd vbmetafixer_windows && zip -r ../vbmetafixer_windows.zip . && cd ..
        cd vbmetafixer_android && zip -r ../vbmetafixer_android.zip . && cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: find_n6-${{ github.sha }}
        name: find_n6-${{ github.sha }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: false
        body: |
          Based on upstream main for Find N6. This release contains two device-facing changes:
          - Mirror the boot menu and Fastboot screen to the N6 cover display.
          - Add Recovery as the first/default boot-menu row and after Restart in Fastboot; both reboot into recovery.

          基于上游 main，为 Find N6 增加两项设备适配：
          - 外屏支持：将启动菜单及 Fastboot 画面同步显示在 N6 外屏。
          - Recovery 菜单：主菜单最前面默认选中 Recovery；Fastboot 菜单的 Restart 后增加 Recovery，选择后进入 recovery。
        files: |
          toolkit_linux.zip
          toolkit_windows.zip
          toolkit_android.zip
          magisk_module.zip
          vbmetafixer_linux.zip
          vbmetafixer_windows.zip
          vbmetafixer_android.zip
